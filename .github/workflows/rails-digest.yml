# Example: every Monday, re-read paid-ad rails and post what changed to Slack or Discord.
# Disabled until you set the repository variable ENABLE_PAID_AD_RAILS=true.
# Secrets: PEEKPANDA_TOKEN (PeekPanda API key), RAILS_WEBHOOK_URL (Slack or Discord incoming webhook).
# Each run is one API call (Peek allows 30 a day, Panda 1,000).
name: rails-digest
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
jobs:
  report:
    if: vars.ENABLE_PAID_AD_RAILS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache/restore@v4
        with:
          path: rails-state.json
          key: rails-state-${{ github.run_id }}
          restore-keys: rails-state-
      - name: Paid-ad rails digest
        env:
          PEEKPANDA_TOKEN: ${{ secrets.PEEKPANDA_TOKEN }}
          RAILS_WEBHOOK_URL: ${{ secrets.RAILS_WEBHOOK_URL }}
        run: |
          # Edit the filters as needed.
          node cli.js --platform meta --advertisers 8 --rail-size 10 --state rails-state.json --archive history --webhook "$RAILS_WEBHOOK_URL" >> "$GITHUB_STEP_SUMMARY"
          node cli.js --file rails-state.json --format csv > rails-digest.csv
      - uses: actions/cache/save@v4
        with:
          path: rails-state.json
          key: rails-state-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: rails-digest
          path: |
            rails-digest.csv
            history/
